<style>
  body { font: 13px Inter, system-ui, sans-serif; margin: 0; padding: 14px; color: #141925; }
  h2 { font-size: 14px; margin: 0 0 6px; }
  p { margin: 0 0 10px; color: #5b6376; }
  textarea { width: 100%; height: 250px; box-sizing: border-box; font: 11px ui-monospace, monospace; border: 1px solid #d9dde6; border-radius: 6px; padding: 8px; }
  button { margin-top: 10px; width: 100%; padding: 9px; border: 0; border-radius: 6px; background: #2d55e0; color: #fff; font-weight: 600; cursor: pointer; }
  #status { margin-top: 8px; font-size: 12px; }
  .err { color: #c0392b; }
</style>
<h2>Blueprint Importer</h2>
<p>In Blueprint Studio, open Publish → Figma, press Publish, then Copy for Figma plugin. Paste the JSON here.</p>
<textarea id="json" placeholder='{"version":1,"frames":[...]}'></textarea>
<button id="go">Build wireframes</button>
<div id="status"></div>
<script>
  const status = document.getElementById('status');
  document.getElementById('go').onclick = () => {
    status.textContent = 'Building…';
    status.className = '';
    parent.postMessage({ pluginMessage: { type: 'import', json: document.getElementById('json').value } }, '*');
  };
  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === 'done') status.textContent = `Imported ${m.count} screens.`;
    if (m.type === 'error') { status.textContent = m.message; status.className = 'err'; }
  };
</script>
